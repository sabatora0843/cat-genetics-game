<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Coat Genetics Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>CAT COAT GENETICS QUIZ</h1>
      <p>遺伝子型から猫の毛色を当てるゲーム</p>
    </header>

    <section class="card">
      <div class="top-row">
        <div id="questionNumber" class="badge">第 1 問</div>
        <div id="score" class="score">SCORE 0 / 0</div>
      </div>

      <div id="catHint" class="cat-hint"></div>

      <h2>この猫の毛色は？</h2>
      <div id="choices" class="choices"></div>

      <section id="result" class="result hidden">
        <div id="resultTitle" class="result-title"></div>
        <div id="correctAnswer" class="correct-answer"></div>

        <h3>遺伝子型</h3>
        <div id="genome" class="genome"></div>

        <h3>判定理由</h3>
        <ul id="explanation"></ul>

        <button id="nextButton" type="button">次の問題</button>
      </section>
    </section>

    <section class="rules">
      <h2>主要遺伝子</h2>
      <div class="rule-grid">
        <div><strong>W</strong><span>優性白</span></div>
        <div><strong>O</strong><span>オレンジ</span></div>
        <div><strong>A</strong><span>アグーチ</span></div>
        <div><strong>B</strong><span>黒 / チョコレート</span></div>
        <div><strong>C</strong><span>カラーポイント</span></div>
        <div><strong>D</strong><span>希釈</span></div>
        <div><strong>I</strong><span>シルバー / スモーク</span></div>
        <div><strong>S</strong><span>白斑</span></div>
        <div><strong>T</strong><span>タビー模様</span></div>
        <div><strong>L</strong><span>長毛</span></div>
      </div>
      <p class="note">※ 実際の猫の毛色遺伝を簡略化した教材・ゲーム用モデルです。</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
