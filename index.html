<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Coat Genetics Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>CAT COAT GENETICS QUIZ</h1>
      <p>遺伝子型から猫の毛色を当てるゲーム</p>
    </header>

    <section class="card">
      <div class="top-row">
        <div id="questionNumber" class="badge">第 1 問</div>
        <div id="score" class="score">SCORE 0 / 0</div>
      </div>

      <div id="genome" class="genome"></div>

      <h2>この猫の毛色は？</h2>
      <div id="choices" class="choices"></div>

      <section id="result" class="result hidden">
        <div id="resultTitle" class="result-title"></div>
        <div id="correctAnswer" class="correct-answer"></div>
        <h3>判定理由</h3>
        <ul id="explanation"></ul>
        <button id="nextButton" type="button">次の問題</button>
      </section>
    </section>

    <section class="rules">
      <h2>主要ルール</h2>
      <ul>
        <li><strong>W_</strong>：優性白</li>
        <li><strong>S_</strong>：白斑</li>
        <li><strong>dd</strong>：希釈（ブラック→ブルー、レッド→クリーム）</li>
        <li><strong>bb</strong>：チョコレート系</li>
        <li><strong>A_</strong>：アグーチ / タビー</li>
        <li><strong>aa</strong>：ソリッド</li>
        <li><strong>O</strong>：オレンジ系</li>
        <li><strong>♀ Oo</strong>：トーティ / キャリコ系</li>
      </ul>
      <p class="note">※ 実際の猫の毛色遺伝を簡略化したゲーム用モデルです。</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
